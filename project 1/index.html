<!DOCTYPE html>
<html lang="en">
<head>
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gazetteer</title>


<!-- Core Styles -->
<link rel="stylesheet" href="assets/bootstrap/bootstrap.min.css" />
<link rel="stylesheet" href="assets/leaflet/leaflet.css" />
<link rel="stylesheet" href="assets/markercluster/MarkerCluster.css" />
<link rel="stylesheet" href="assets/markercluster/MarkerCluster.Default.css" />
<link rel="stylesheet" href="assets/leaflet-extra-markers/leaflet.extra-markers.min.css" />
<link rel="stylesheet" href="assets/leaflet-easybutton/easy-button.css" />
<link rel="stylesheet" href="assets/fontawesome/css/all.min.css" />
<link rel="stylesheet" href="style.css" />


</head>

</head>
<body>
  <!-- Navbar + country dropdown -->
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand">Gazetteer</span>
    <select id="countrySelect" class="form-select w-auto ms-3">
      <option value="">Select a country</option>
    </select>
  </nav>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Modal trigger buttons -->
  <div class="position-absolute top-0 end-0 m-3 d-flex flex-column gap-2 z-3">
    <button class="btn btn-info"    data-bs-toggle="modal" data-bs-target="#modalWiki">Wikipedia</button>
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalCurrency">Currency</button>
    <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#modalWeather">Weather</button>
    <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#modalNews">News</button>
  </div>

  <!-- Wikipedia Modal -->
  <div class="modal fade" id="modalWiki" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5>Wikipedia</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="wikiContent"></div>
      </div>
    </div>
  </div>

  <!-- Currency Modal with Converter -->
  <div class="modal fade" id="modalCurrency" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5>Currency Converter</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="currencyForm">
            <div class="mb-3">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="amount" value="1" min="0" step="any" required>
            </div>
            <div class="mb-3">
              <label for="fromCurrency" class="form-label">From</label>
              <select class="form-select" id="fromCurrency"></select>
            </div>
            <div class="mb-3">
              <label for="toCurrency" class="form-label">To</label>
              <select class="form-select" id="toCurrency"></select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Convert</button>
          </form>
          <div class="mt-3" id="conversionResult"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Weather Modal -->
  <div class="modal fade" id="modalWeather" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5>Weather</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="weatherContent"></div>
      </div>
    </div>
  </div>

  <!-- News Modal -->
  <div class="modal fade" id="modalNews" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5>News</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="newsContent"></div>
      </div>
    </div>
  </div>


<!-- Core Scripts -->
<script src="assets/jquery/jquery.min.js"></script>
<script src="assets/bootstrap/bootstrap.bundle.min.js"></script>
<script src="assets/leaflet/leaflet.js"></script>
<script src="assets/markercluster/leaflet.markercluster.js"></script>
<script src="assets/leaflet-extra-markers/leaflet.extra-markers.min.js"></script>
<script src="assets/leaflet-easybutton/easy-button.js"></script>
<script src="assets/fontawesome/js/all.min.js"></script>
<script src="app.js"></script>

</body>
</html>
